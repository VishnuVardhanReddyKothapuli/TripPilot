services:
  - type: web
    name: trippilot-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trippilot-db
          property: connectionString
      - key: LLM_PROVIDER
        value: ollama
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        value: llama3.2:latest
      - key: FRONTEND_URL
        value: https://trippilot-frontend.onrender.com
      - key: OPEN_METEO_BASE_URL
        value: https://api.open-meteo.com/v1
      - key: OPEN_METEO_GEOCODING_URL
        value: https://geocoding-api.open-meteo.com/v1
      - key: OVERPASS_URL
        value: https://overpass-api.de/api/interpreter
      - key: REST_COUNTRIES_URL
        value: https://restcountries.com/v3.1
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: trippilot-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://trippilot-backend.onrender.com

databases:
  - name: trippilot-db
    databaseName: trippilot
    user: postgres
    plan: free
    postgresMajorVersion: "16"
